<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- As páginas usam o bloco titulo; as da aula (404 e 500) usam titulo_aba. Os dois funcionam. -->
  <title>{% block titulo_aba %}{% block titulo %}Pet Feliz{% endblock %}{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="fundo-cinza">

  <!-- Layout SEM menu: usado pelo login e pelas páginas de erro 404 e 500 -->
  <main class="container mt-5">

    <!-- MENSAGENS DO FLASH (ex.: "E-mail ou senha incorretos.") -->
    {% for tipo, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="alert alert-{{ tipo }} alert-dismissible fade show">
            {{ mensagem }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        </div>
      </div>
    {% endfor %}

    {% block conteudo %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
