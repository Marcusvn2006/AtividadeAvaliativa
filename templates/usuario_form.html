{% extends 'base.html' %}

{% block titulo %}Cadastro de Usuários — Pet Feliz{% endblock %}

{% block conteudo %}

  <h2 class="mb-3">Cadastro de Usuários</h2>

  <div class="card">
    <div class="card-body">
      <form action="{{ url_for('cadastro_usuario') }}" method="post">

        <!-- Nome | Email -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome"
                   value="{{ usuario.nome | default('') }}" required minlength="3">
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ usuario.email | default('') }}" required>
          </div>
        </div>

        <!-- Celular | Data de Nascimento | CPF | Nível de Acesso -->
        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <label for="celular" class="form-label">Celular:</label>
            <input type="text" class="form-control" id="celular" name="celular"
                   value="{{ usuario.celular | default('') }}">
          </div>
          <div class="col-md-3">
            <label for="data_nascimento" class="form-label">Data de Nascimento:</label>
            <input type="text" class="form-control" id="data_nascimento" name="data_nascimento"
                   placeholder="dd/mm/aaaa" value="{{ usuario.data_nascimento | default('') }}">
          </div>
          <div class="col-md-3">
            <label for="cpf" class="form-label">CPF:</label>
            <input type="text" class="form-control" id="cpf" name="cpf"
                   value="{{ usuario.cpf | default('') }}">
          </div>
          <div class="col-md-3">
            <label for="nivel_acesso" class="form-label text-danger fw-bold">Nível de Acesso:</label>
            <select class="form-select" id="nivel_acesso" name="nivel_acesso" required>
              <option value="">-- ESCOLHA --</option>
              <option value="Usuário" {% if usuario.nivel_acesso == 'Usuário' %}selected{% endif %}>Usuário</option>
              <option value="Administrador" {% if usuario.nivel_acesso == 'Administrador' %}selected{% endif %}>Administrador</option>
            </select>
          </div>
        </div>

        <!-- CEP | Endereço | Número -->
        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <label for="cep" class="form-label">CEP:</label>
            <input type="text" class="form-control" id="cep" name="cep"
                   value="{{ usuario.cep | default('') }}">
          </div>
          <div class="col-md-7">
            <label for="endereco" class="form-label">Endereço:</label>
            <input type="text" class="form-control" id="endereco" name="endereco"
                   value="{{ usuario.endereco | default('') }}">
          </div>
          <div class="col-md-2">
            <label for="numero" class="form-label">Número:</label>
            <input type="text" class="form-control" id="numero" name="numero"
                   value="{{ usuario.numero | default('') }}">
          </div>
        </div>

        <!-- Complemento | Cidade -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="complemento" class="form-label">Complemento:</label>
            <input type="text" class="form-control" id="complemento" name="complemento"
                   value="{{ usuario.complemento | default('') }}">
          </div>
          <div class="col-md-6">
            <label for="cidade" class="form-label">Cidade:</label>
            <input type="text" class="form-control" id="cidade" name="cidade"
                   value="{{ usuario.cidade | default('') }}">
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('lista_usuarios') }}" class="btn btn-outline-dark">Voltar</a>
          <button type="reset" class="btn btn-secondary">Limpar</button>
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>

      </form>
    </div>
  </div>

{% endblock %}
