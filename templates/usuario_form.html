{% extends 'base.html' %}

{% block titulo %}Cadastro de Usuários — Pet Feliz{% endblock %}

{% block conteudo %}

  <h2 class="mb-3">{% if usuario.id_usuario %}Editar Usuário{% else %}Cadastro de Usuários{% endif %}</h2>

  <div class="card">
    <div class="card-body">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Nome | Email -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome"
                   value="{{ usuario.nome or '' }}" required minlength="3">
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ usuario.email or '' }}" required>
          </div>
        </div>

        <!-- Celular | Data de Nascimento | CPF | Nível de Acesso -->
        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <label for="celular" class="form-label">Celular:</label>
            <input type="text" class="form-control" id="celular" name="celular"
                   value="{{ usuario.celular or '' }}">
          </div>
          <div class="col-md-3">
            <label for="data_nascimento" class="form-label">Data de Nascimento:</label>
            <input type="date" class="form-control" id="data_nascimento" name="data_nascimento"
                   value="{{ usuario.data_nascimento or '' }}">
          </div>
          <div class="col-md-3">
            <label for="cpf" class="form-label">CPF:</label>
            <input type="text" class="form-control" id="cpf" name="cpf"
                   value="{{ usuario.cpf or '' }}">
          </div>
          <div class="col-md-3">
            <label for="nivel_acesso" class="form-label text-danger fw-bold">Nível de Acesso:</label>
            <select class="form-select" id="nivel_acesso" name="nivel_acesso" required>
              <option value="">-- ESCOLHA --</option>
              <option value="Usuário" {% if usuario.nivel_acesso == 'Usuário' %}selected{% endif %}>Usuário</option>
              <option value="Administrador" {% if usuario.nivel_acesso == 'Administrador' %}selected{% endif %}>Administrador</option>
            </select>
          </div>
        </div>

        <!-- CEP | Endereço | Número -->
        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <label for="cep" class="form-label">CEP:</label>
            <input type="text" class="form-control" id="cep" name="cep"
                   value="{{ usuario.cep or '' }}">
          </div>
          <div class="col-md-7">
            <label for="endereco" class="form-label">Endereço:</label>
            <input type="text" class="form-control" id="endereco" name="endereco"
                   value="{{ usuario.endereco or '' }}">
          </div>
          <div class="col-md-2">
            <label for="numero" class="form-label">Número:</label>
            <input type="text" class="form-control" id="numero" name="numero"
                   value="{{ usuario.numero or '' }}">
          </div>
        </div>

        <!-- Complemento | Cidade -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="complemento" class="form-label">Complemento:</label>
            <input type="text" class="form-control" id="complemento" name="complemento"
                   value="{{ usuario.complemento or '' }}">
          </div>
          <div class="col-md-6">
            <label for="cidade" class="form-label">Cidade:</label>
            <input type="text" class="form-control" id="cidade" name="cidade"
                   value="{{ usuario.cidade or '' }}">
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('lista_usuarios') }}" class="btn btn-outline-dark">Voltar</a>
          <button type="reset" class="btn btn-secondary">Limpar</button>
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>

      </form>
    </div>
  </div>

{% endblock %}
