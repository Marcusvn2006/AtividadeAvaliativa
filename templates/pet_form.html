{% extends 'base.html' %}

{% block titulo %}Cadastro de Pets — Pet Feliz{% endblock %}

{% block conteudo %}

  <h2 class="mb-3">Cadastro de Pets</h2>

  <div class="card">
    <div class="card-body">
      <form action="{{ url_for('cadastro_pet') }}" method="post">

        <!-- Nome | Espécie | Raça -->
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="nome" class="form-label">Nome do Pet:</label>
            <input type="text" class="form-control" id="nome" name="nome"
                   value="{{ pet.nome | default('') }}" required>
          </div>
          <div class="col-md-4">
            <label for="especie" class="form-label text-danger fw-bold">Espécie:</label>
            <select class="form-select" id="especie" name="especie" required>
              <option value="">-- ESCOLHA --</option>
              <option value="Cão" {% if pet.especie == 'Cão' %}selected{% endif %}>Cão</option>
              <option value="Gato" {% if pet.especie == 'Gato' %}selected{% endif %}>Gato</option>
              <option value="Ave" {% if pet.especie == 'Ave' %}selected{% endif %}>Ave</option>
              <option value="Roedor" {% if pet.especie == 'Roedor' %}selected{% endif %}>Roedor</option>
              <option value="Outro" {% if pet.especie == 'Outro' %}selected{% endif %}>Outro</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="raca" class="form-label">Raça:</label>
            <input type="text" class="form-control" id="raca" name="raca"
                   value="{{ pet.raca | default('') }}">
          </div>
        </div>

        <!-- Porte | Data de Nascimento | Peso | Tutor -->
        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <label for="porte" class="form-label">Porte:</label>
            <select class="form-select" id="porte" name="porte">
              <option value="">-- ESCOLHA --</option>
              <option value="Pequeno" {% if pet.porte == 'Pequeno' %}selected{% endif %}>Pequeno</option>
              <option value="Médio" {% if pet.porte == 'Médio' %}selected{% endif %}>Médio</option>
              <option value="Grande" {% if pet.porte == 'Grande' %}selected{% endif %}>Grande</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="data_nascimento" class="form-label">Data de Nascimento:</label>
            <input type="text" class="form-control" id="data_nascimento" name="data_nascimento"
                   placeholder="dd/mm/aaaa" value="{{ pet.data_nascimento | default('') }}">
          </div>
          <div class="col-md-2">
            <label for="peso" class="form-label">Peso (kg):</label>
            <input type="text" class="form-control" id="peso" name="peso"
                   value="{{ pet.peso | default('') }}">
          </div>
          <div class="col-md-4">
            <label for="tutor" class="form-label">Tutor (dono):</label>
            <input type="text" class="form-control" id="tutor" name="tutor"
                   value="{{ pet.tutor | default('') }}" required>
          </div>
        </div>

        <!-- Observações -->
        <div class="mb-3">
          <label for="observacoes" class="form-label">Observações:</label>
          <textarea class="form-control" id="observacoes" name="observacoes"
                    rows="3">{{ pet.observacoes | default('') }}</textarea>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('lista_pets') }}" class="btn btn-outline-dark">Voltar</a>
          <button type="reset" class="btn btn-secondary">Limpar</button>
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>

      </form>
    </div>
  </div>

{% endblock %}
