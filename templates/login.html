{% extends 'base_sem_menu.html' %}

{% block titulo %}Login — Pet Feliz{% endblock %}

{% block conteudo %}
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="card border-info mb-3">
        <div class="card-header bg-info text-white">Dados para acesso</div>
        <div class="card-body">
          <p class="mb-1"><strong>E-mail:</strong> admin@petfeliz.com</p>
          <p class="mb-0"><strong>Senha:</strong> 123456</p>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header text-center py-3">
          <span class="fs-1 fw-bold">Pet Feliz</span>
        </div>

        <div class="card-body">
          <h2 class="text-center mb-4">Login</h2>

          <form action="{{ url_for('login') }}" method="post">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail:</label>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="Digite seu e-mail" value="{{ email | default('') }}">
            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha:</label>
              <input type="password" class="form-control" id="senha" name="senha"
                     placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn btn-success w-100">Entrar</button>
          </form>

          <div class="text-center mt-3 mb-3">
            <a href="#">Recuperar Senha</a>
          </div>

          <a href="{{ url_for('cadastro_usuario') }}" class="btn btn-primary w-100">CADASTRAR</a>
        </div>
      </div>

    </div>
  </div>
{% endblock %}
