{% extends 'base.html' %}

{% block titulo %}Cadastro de Serviços — Pet Feliz{% endblock %}

{% block conteudo %}

  <h2 class="mb-3">Cadastro de Serviços</h2>

  <div class="card">
    <div class="card-body">
      <form action="{{ url_for('cadastro_servico') }}" method="post">

        <!-- Nome | Preço | Duração -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome do Serviço:</label>
            <input type="text" class="form-control" id="nome" name="nome"
                   value="{{ servico.nome | default('') }}" required>
          </div>
          <div class="col-md-3">
            <label for="preco" class="form-label">Preço (R$):</label>
            <input type="text" class="form-control" id="preco" name="preco"
                   placeholder="0,00" value="{{ servico.preco | default('') }}" required>
          </div>
          <div class="col-md-3">
            <label for="duracao_minutos" class="form-label">Duração (minutos):</label>
            <input type="text" class="form-control" id="duracao_minutos" name="duracao_minutos"
                   value="{{ servico.duracao_minutos | default('') }}" required>
          </div>
        </div>

        <!-- Descrição -->
        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição:</label>
          <textarea class="form-control" id="descricao" name="descricao"
                    rows="3">{{ servico.descricao | default('') }}</textarea>
        </div>

        <!-- Ativo -->
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="ativo" name="ativo" value="sim"
                 {% if servico.ativo == 'sim' %}checked{% endif %}>
          <label class="form-check-label" for="ativo">Serviço ativo</label>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('lista_servicos') }}" class="btn btn-outline-dark">Voltar</a>
          <button type="reset" class="btn btn-secondary">Limpar</button>
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>

      </form>
    </div>
  </div>

{% endblock %}
