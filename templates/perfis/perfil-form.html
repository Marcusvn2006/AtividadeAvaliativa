{% extends "layout/base_menu.html" %}

{% block titulo %} Perfil {% endblock %}

{% block conteudo %}

<div class="card" style="width: 900px;">
  <div class="card-header bg-danger text-white fw-bold">
    Cadastro de Perfil
  </div>
  <div class="card-body p-3">
    
    <form action="{{ url_for('inserir_perfil') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{csrf_token()}}">

        <label for="nome" class="form-label">Nome do Perfil</label>
        <input value="{{nome}}" minlength="3" required
        type="text" name="nome" id="nome" class="form-control" mb-3>

        <label for="descricao" class="form-label">Descrição</label>
        <textarea name="descricao" id="descricao" class="form-control mb-3">{{descricao}}</textarea>

        <div class="d-flex justify-content-between">
            <a href="{{url_for('listar_perfis')}}" class="btn btn-light">Voltar</a>

            <button type="submit" class="btn btn-success">Salvar</button>
        </div>

    </form>

  </div>
</div>

{% endblock %}
