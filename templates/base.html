<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Pet Feliz{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- MENU SUPERIOR -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Pet Feliz</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('lista_usuarios') }}">Usuários</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('cadastro_usuario') }}">Novo Usuário</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('lista_pets') }}">Pets</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('cadastro_pet') }}">Novo Pet</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('lista_servicos') }}">Serviços</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('cadastro_servico') }}">Novo Serviço</a>
          </li>
        </ul>

        <!-- Campo Procurar: envia ?q=termo para a rota /busca -->
        <form class="d-flex gap-2 ms-auto" action="{{ url_for('busca') }}" method="get">
          <input class="form-control" type="search" name="q" placeholder="Procurar">
          <a href="{{ url_for('login') }}" class="btn btn-secondary">SAIR</a>
        </form>
      </div>
    </div>
  </nav>

  <!-- ERROS: a lista 'erros' vem do Python; o for cria um item para cada erro -->
  {% if erros %}
    <div class="container mt-3">
      <div class="alert alert-danger">
        <ul class="mb-0">
          {% for erro in erros %}
            <li>{{ erro }}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  {% endif %}

  <!-- CONTEÚDO DE CADA PÁGINA -->
  <main class="container mt-4 mb-5">
    {% block conteudo %}{% endblock %}
  </main>

  <!-- RODAPÉ -->
  <footer class="text-center py-3 mt-auto">
    <div class="container">
      Projeto desenvolvido por: Marcus Vinicius Avanso Romão
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
